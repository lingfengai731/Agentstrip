    <script>
      (function () {
        var body = document.body;
        var toggle = document.getElementById('themeToggle');
        var media = window.matchMedia('(prefers-color-scheme: dark)');
        var saved = localStorage.getItem('theme') || (media.matches ? 'dark' : '');
        if (saved === 'dark') { body.classList.add('dark'); toggle.checked = true; }
        toggle.addEventListener('change', function (event) {
          body.classList.toggle('dark', event.target.checked);
          localStorage.setItem('theme', event.target.checked ? 'dark' : '');
        });
      })();
    </script>
